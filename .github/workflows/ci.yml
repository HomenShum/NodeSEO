name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      # The shared flag/config/env/path rules every command inherits. No browser,
      # no keys, ~1s. `verify:journey-gate` is deliberately NOT here — it needs a
      # chromium download; see docs/codebase/CONCERNS.md.
      - run: npm run verify:cli
      - run: npm run verify:tours
